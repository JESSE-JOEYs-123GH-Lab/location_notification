name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Repair and Build Flutter App
        run: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          echo "Flutter project gevonden in: $TARGET_DIR"
          cd "$TARGET_DIR"

          if [ ! -d "android" ]; then
            echo "Android-map ontbreekt! 'flutter create .' wordt uitgevoerd..."
            flutter create . --platforms=android --org=com.example
          fi

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-notification-apk
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
