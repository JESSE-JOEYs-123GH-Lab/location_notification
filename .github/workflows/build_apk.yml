name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          if [ -d "location_notification" ]; then
            cd location_notification && flutter pub get
          else
            flutter pub get
          fi

      - name: Build APK
        run: |
          if [ -d "location_notification" ]; then
            cd location_notification && flutter build apk --release --no-tree-shake-icons
          else
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-notification-apk
          path: |
            location_notification/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
